name: Refresh profile cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - "scripts/**"
      - "design/lib.mjs"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare output directories
        run: mkdir -p assets/generated

      - name: Generate contribution loop
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake.svg?palette=github-dark&color_snake=#f3a8c6&color_dots=#1f2546,#343a6e,#6a628f,#b08f5e,#f0c865

      - name: Render trailblaze record and frame the loop
        run: node scripts/render-dynamic.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trailblaze.svg assets/cycles.svg assets/generated/snake.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards [skip ci]"
          git push
